version: 2.1
jobs:
  build:
    docker:
      - image: cimg/php:8.3
      - image: cimg/mariadb:10.11
        environment:
          MYSQL_USER: root
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-v007-{{ checksum "www/html/wp-content/plugins/vanicacummings/composer.lock" }}
      - restore_cache:
          keys:
            - node-modules-v007-{{ checksum "www/package-lock.json" }}
      - run:
          name: Database Check
          command: dockerize -wait tcp://127.0.0.1:3306 -timeout 120s
      - run:
          name: Install Server Dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y default-mysql-client subversion
            sudo docker-php-ext-install mysqli
            mkdir -p ~/test-results/mocha ~/test-results/phpunit
      - run:
          name: Install Node.js
          command: |
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV"
            echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> "$BASH_ENV"
            . "$BASH_ENV"
            nvm install 10.24.1
      - run:
          name: Install PHP_CodeSniffer
          command: sudo pear install PHP_CodeSniffer
      - run:
          name: Spin up WordPress Test Environment
          working_directory: www/html/wp-content/plugins/vanicacummings/tests/bin
          command: ./install-wp-tests.sh wordpress_test root '' 127.0.0.1 latest
      - run:
          name: npm install
          working_directory: www
          command: |
            if [ ! -e node_modules ]; then
              npm install --silent
            fi
      - run:
          name: composer install
          working_directory: www/html/wp-content/plugins/vanicacummings
          command: |
            if [ ! -e vendor ]; then
              composer install -o
            fi
      - save_cache:
          key: composer-v005-{{ checksum "www/html/wp-content/plugins/vanicacummings/composer.lock" }}
          paths:
            - www/html/wp-content/plugins/vanicacummings/vendor
      - save_cache:
          key: node-modules-v005-{{ checksum "www/package-lock.json" }}
          paths:
            - www/node_modules
      - run:
          name: Compile
          working_directory: www
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              npx gulp --production
            else
              npx gulp
            fi
      - run:
          name: Check Production Dependencies for Vulnerabilities
          working_directory: www
          command: |
            npm audit --production
            cd html/wp-content/plugins/vanicacummings && composer audit --no-dev
      - run:
          name: PHP Coding Standards
          working_directory: www
          command: phpcs --standard=phpcs.xml
          when: always
      - run:
          name: JavaScript Unit Tests
          working_directory: www
          command: npx mocha --require babel-core/register --reporter mocha-junit-reporter --reporter-options mochaFile=~/test-results/mocha/results.xml src/scripts/tests/unit-tests
          when: always
      - run:
          name: PHP Unit Tests
          working_directory: www
          command: html/wp-content/plugins/vanicacummings/vendor/bin/phpunit --log-junit ~/test-results/phpunit/results.xml
          when: always
      - store_test_results:
          path: ~/test-results
      - store_artifacts:
          path: ~/test-results
      - run:
          name: Deploy
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              ./bin/deploy/prod/deploy-code.sh
            fi

workflows:
  build_and_deploy:
    jobs:
      - build
